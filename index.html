<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Web simulator of an in-order RISC-V pipeline with multicycle floating-point units (Hennessy and Patterson, Chapter 3 and Appendix C). Cycle diagram, cycle-by-cycle mode, English and Spanish.">
<meta property="og:title" content="Pipeline FP RISC-V">
<meta property="og:description" content="Teaching simulator for instruction scheduling: 5-stage RISC-V pipeline with multicycle FP units.">
<meta property="og:type" content="website">
<title>Pipeline FP RISC-V</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
[hidden]{display:none!important}
html,body{margin:0}

/* Layout: two-column workbench, code and settings on the left, cycle diagram on the right; a single column on phones */
:root{
  --bg:#edf0f3; --surface:#fafbfc; --raised:#ffffff; --ink:#15202a; --muted:#5a6672; --line:#d2d9e0; --line-soft:#e3e8ed;
  --accent:#1c5b76; --accent-ink:#ffffff; --accent-soft:#d9e8ef; --danger:#a8261c; --danger-soft:#f8e1de;
  --s-if:#d8e5f5; --s-if-ink:#1c3d63;
  --s-id:#e3ddf4; --s-id-ink:#42307a;
  --s-ex:#d4ecdc; --s-ex-ink:#1d5432;
  --s-mem:#f3e5c5; --s-mem-ink:#67480b;
  --s-wb:#e1e5e9; --s-wb-ink:#2e3943;
  --s-add:#c6e7ea; --s-add-ink:#0e4f56;
  --s-mul:#f2d5e3; --s-mul-ink:#771e4a;
  --s-div:#f5d8c2; --s-div-ink:#77380b;
  --st-raw:#f5cfc9; --st-raw-ink:#8a1b12;
  --st-struct:#f3dfae; --st-struct-ink:#6e4c08;
  --st-waw:#e3cff1; --st-waw-ink:#5b2280;
  --st-wait:#e8ecef; --st-wait-ink:#7a8590;
  --st-ctrl:#c9d1d9; --st-ctrl-ink:#3d4955;
  --flush:#98a3ae;
  --font-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display:"IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11171d; --surface:#161e25; --raised:#1b242c; --ink:#e3e9ee; --muted:#93a1ad; --line:#2c3843; --line-soft:#222c35;
    --accent:#6fb5d3; --accent-ink:#0b1a22; --accent-soft:#1d3946; --danger:#f08a80; --danger-soft:#3b1d1a;
    --s-if:#1f3550; --s-if-ink:#bcd5f3;
    --s-id:#2f2750; --s-id-ink:#d3c8f5;
    --s-ex:#1d3d29; --s-ex-ink:#bfe6cc;
    --s-mem:#43361a; --s-mem-ink:#f1dca8;
    --s-wb:#2a333c; --s-wb-ink:#ccd5dd;
    --s-add:#123f45; --s-add-ink:#b2e6eb;
    --s-mul:#4a1f35; --s-mul-ink:#f4c5dc;
    --s-div:#4a2c16; --s-div-ink:#f6cfaf;
    --st-raw:#4d211c; --st-raw-ink:#ffb9af;
    --st-struct:#463713; --st-struct-ink:#f4d58c;
    --st-waw:#3c2350; --st-waw-ink:#e1c2f7;
    --st-wait:#222b33; --st-wait-ink:#8593a0;
    --st-ctrl:#3d4a57; --st-ctrl-ink:#c3ced8;
    --flush:#5d6a76;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#11171d; --surface:#161e25; --raised:#1b242c; --ink:#e3e9ee; --muted:#93a1ad; --line:#2c3843; --line-soft:#222c35;
    --accent:#6fb5d3; --accent-ink:#0b1a22; --accent-soft:#1d3946; --danger:#f08a80; --danger-soft:#3b1d1a;
    --s-if:#1f3550; --s-if-ink:#bcd5f3;
    --s-id:#2f2750; --s-id-ink:#d3c8f5;
    --s-ex:#1d3d29; --s-ex-ink:#bfe6cc;
    --s-mem:#43361a; --s-mem-ink:#f1dca8;
    --s-wb:#2a333c; --s-wb-ink:#ccd5dd;
    --s-add:#123f45; --s-add-ink:#b2e6eb;
    --s-mul:#4a1f35; --s-mul-ink:#f4c5dc;
    --s-div:#4a2c16; --s-div-ink:#f6cfaf;
    --st-raw:#4d211c; --st-raw-ink:#ffb9af;
    --st-struct:#463713; --st-struct-ink:#f4d58c;
    --st-waw:#3c2350; --st-waw-ink:#e1c2f7;
    --st-wait:#222b33; --st-wait-ink:#8593a0;
    --st-ctrl:#3d4a57; --st-ctrl-ink:#c3ced8;
    --flush:#5d6a76;
    color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font-ui);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:0 32px}
h1,h2,h3{font-family:var(--font-display);font-weight:600;text-wrap:balance;margin:0}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{max-width:1500px;margin-inline:auto;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;padding-block:18px 14px;border-bottom:1px solid var(--line)}
.top h1{font-size:22px;letter-spacing:.01em}
.top p{margin:0;color:var(--muted);font-size:13px;flex:1 1 320px}
.lang{display:flex;gap:2px;border:1px solid var(--line);border-radius:5px;padding:2px;background:var(--surface)}
.lang button{border:0;background:none;border-radius:3px;padding:3px 9px;cursor:pointer;color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.04em}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.layout{max-width:1500px;margin-inline:auto;display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:20px;padding-block:18px}
@media (max-width:1000px){.layout{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line-soft)}
.panel-h h2{font-size:15px}
.panel-b{padding:12px 14px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}

select,input[type=number]{background:var(--raised);border:1px solid var(--line);border-radius:4px;padding:5px 8px}
select{max-width:100%}
input[type=number]{width:64px;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--raised);border-radius:4px;padding:6px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:3px 9px;font-size:12px}

/* editor */
.editor{display:grid;grid-template-columns:auto minmax(0,1fr);border-top:1px solid var(--line-soft);background:var(--raised);height:440px;border-radius:0 0 var(--radius) var(--radius);overflow:hidden}
.gutter{font-family:var(--font-mono);font-size:13px;line-height:20px;color:var(--muted);text-align:right;padding:10px 8px 10px 12px;user-select:none;overflow:hidden;background:var(--surface);border-right:1px solid var(--line-soft);font-variant-numeric:tabular-nums}
.gutter div.err{color:var(--danger);font-weight:600}
textarea#code{font-family:var(--font-mono);font-size:13px;line-height:20px;border:0;outline:none;resize:none;padding:10px 12px;background:transparent;color:var(--ink);white-space:pre;overflow:auto;tab-size:8;min-width:0}
.editor-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px}
.editor-bar .hint{color:var(--muted);font-size:12px;margin-left:auto}
.example-row{display:flex;gap:8px;align-items:center;padding:10px 14px;flex-wrap:wrap}
.example-row select{flex:1 1 220px}
.note{font-size:12.5px;color:var(--muted);padding:0 14px 10px}
.msg-error{margin:0 14px 12px;padding:8px 10px;border-radius:4px;background:var(--danger-soft);color:var(--danger);font-size:13px}

/* config */
.cfg{display:grid;gap:10px}
.cfg-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cfg-row > label:first-child{min-width:150px}
.units{width:100%;border-collapse:collapse;font-size:13px}
.units th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:4px 6px 6px 0}
.units td{padding:4px 6px 4px 0;border-top:1px solid var(--line-soft)}
.check{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line-soft);border-bottom:1px solid var(--line-soft)}
.stat{background:var(--surface);padding:10px 14px}
.stat .v{font-family:var(--font-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;color:var(--muted);font-weight:400}
.breakdown{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 14px;align-items:center;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.sw{width:12px;height:12px;border-radius:2px;display:inline-block;flex:none}
.ref{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px;border-top:1px solid var(--line-soft);font-size:13px}
.ref strong{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.speed-up{color:var(--s-ex-ink);background:var(--s-ex);padding:1px 7px;border-radius:10px;font-family:var(--font-mono)}
.speed-down{color:var(--st-raw-ink);background:var(--st-raw);padding:1px 7px;border-radius:10px;font-family:var(--font-mono)}
.warn{margin:10px 14px;padding:8px 10px;border-radius:4px;background:var(--st-struct);color:var(--st-struct-ink);font-size:13px}

/* diagram */
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:10px 14px;border-bottom:1px solid var(--line-soft);font-size:12px;color:var(--muted)}
.legend .chip span.tag{font-family:var(--font-mono);font-size:10.5px;padding:1px 5px;border-radius:3px}
.diag-wrap{overflow:auto;max-height:620px;position:relative}
table.diag{border-collapse:separate;border-spacing:0;font-family:var(--font-mono);font-size:11px;font-variant-numeric:tabular-nums}
table.diag th,table.diag td{height:24px;padding:0;text-align:center;white-space:nowrap}
table.diag thead th{position:sticky;top:0;background:var(--surface);color:var(--muted);font-weight:500;border-bottom:1px solid var(--line);z-index:2;min-width:38px;width:38px}
table.diag thead th.ins-h{left:0;z-index:3;text-align:left;padding:0 10px;min-width:220px}
table.diag td.ins{position:sticky;left:0;background:var(--surface);text-align:left;padding:0 10px;border-right:1px solid var(--line);z-index:1;font-size:12px;color:var(--ink);max-width:280px;overflow:hidden;text-overflow:ellipsis}
table.diag td.ins .ln{color:var(--muted);display:inline-block;width:28px}
table.diag td.ins .slot{font-family:var(--font-ui);font-size:10px;color:var(--accent);margin-left:6px}
table.diag tbody tr:hover td{box-shadow:inset 0 1px 0 var(--line),inset 0 -1px 0 var(--line)}
table.diag tbody tr:hover td.ins{background:var(--accent-soft)}
table.diag td.c{min-width:38px;width:38px;border-right:1px solid var(--line-soft)}
td.c span{display:block;margin:2px 1px;line-height:20px;border-radius:3px;font-weight:500}
.k-IF{background:var(--s-if);color:var(--s-if-ink)}
.k-ID{background:var(--s-id);color:var(--s-id-ink)}
.k-EX{background:var(--s-ex);color:var(--s-ex-ink)}
.k-MEM{background:var(--s-mem);color:var(--s-mem-ink)}
.k-WB{background:var(--s-wb);color:var(--s-wb-ink)}
.k-A{background:var(--s-add);color:var(--s-add-ink)}
.k-M{background:var(--s-mul);color:var(--s-mul-ink)}
.k-D{background:var(--s-div);color:var(--s-div-ink)}
.k-raw{background:repeating-linear-gradient(135deg,var(--st-raw) 0 4px,transparent 4px 7px);color:var(--st-raw-ink);border:1px solid var(--st-raw)}
.k-struct{background:repeating-linear-gradient(135deg,var(--st-struct) 0 4px,transparent 4px 7px);color:var(--st-struct-ink);border:1px solid var(--st-struct)}
.k-waw{background:repeating-linear-gradient(135deg,var(--st-waw) 0 4px,transparent 4px 7px);color:var(--st-waw-ink);border:1px solid var(--st-waw)}
.k-wait{background:var(--st-wait);color:var(--st-wait-ink)}
.k-control{background:repeating-linear-gradient(135deg,var(--st-ctrl) 0 4px,transparent 4px 7px);color:var(--st-ctrl-ink);border:1px solid var(--st-ctrl)}
.k-flush{color:var(--flush);font-weight:600}
tr.flushed td.ins{color:var(--flush);text-decoration:line-through}
td.c span[title]{cursor:help}
.pager{display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--line-soft);font-size:13px;color:var(--muted);flex-wrap:wrap}

/* cycle-by-cycle mode */
.modes{display:flex;gap:4px}
.modes button{border:1px solid transparent;background:none;border-radius:4px;padding:4px 10px;cursor:pointer;color:var(--muted);font-weight:500}
.modes button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);border-color:var(--line)}
.stepbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 14px;border-bottom:1px solid var(--line-soft)}
.stepbar .btn{min-width:38px}
.stepbar .now-label{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:15px;font-weight:500;min-width:120px}
.stepbar input[type=range]{flex:1 1 180px;accent-color:var(--accent);min-width:120px}
.pipe-wrap{overflow-x:auto}
.pipe{display:grid;grid-template-columns:86px 86px auto 80px 80px;gap:6px;align-items:center;padding:14px;min-width:min-content}
.lanes{display:grid;gap:6px}
.lane{display:flex;gap:4px;align-items:center}
.lane .lname{width:42px;flex:none;font-size:11px;color:var(--muted);text-align:right;padding-right:4px}
.stage{border:1px solid var(--line);border-radius:4px;background:var(--raised);height:46px;padding:3px 6px;font-family:var(--font-mono);font-size:11px;min-width:0;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.lane .stage{width:66px;flex:none;font-size:10px;padding:3px}
.stage{padding:3px 4px;font-size:10.5px}
.stage .nm{font-family:var(--font-ui);font-size:10px;letter-spacing:.04em;text-transform:uppercase;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage .in{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage .in + .in{border-top:1px dotted currentColor}
.stage.idle{color:var(--muted)}
.stage.idle .in{opacity:.5}
.events{padding:4px 14px 14px;display:grid;gap:4px;font-size:13px}
.events div{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;align-items:baseline}
.events .tag{font-family:var(--font-mono);font-size:10.5px;padding:1px 5px;border-radius:3px;text-align:center}
.events code{font-family:var(--font-mono);font-size:12.5px}
table.diag th.now{background:var(--accent);color:var(--accent-ink)}
table.diag td.c.now{background:var(--accent-soft)}
.state-grid div.chg{color:var(--s-ex-ink);background:var(--s-ex);font-weight:600}
.mem-table tr.chg td{background:var(--s-ex);color:var(--s-ex-ink);font-weight:600}
/* units with many stages: compact cells */
.minis-wrap{display:grid;gap:3px;max-width:486px}
.minis{display:flex;flex-wrap:wrap;gap:2px}
.mini{width:18px;height:22px;border:1px solid var(--line);border-radius:3px;background:var(--raised);font-family:var(--font-mono);font-size:8.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.mini.on{font-weight:600;border-color:transparent}
.mini.k-A{background:var(--s-add);color:var(--s-add-ink)}
.mini.k-M{background:var(--s-mul);color:var(--s-mul-ink)}
.mini.k-D{background:var(--s-div);color:var(--s-div-ink)}
.minis-cap{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:14px}
.minis-cap b{font-weight:600;color:var(--ink)}
.stage.busy-np{width:auto!important;min-width:120px}
/* details */
.details{padding:6px 14px 12px}
.details ol{margin:0;padding-left:0;list-style:none;display:grid;gap:6px}
.details li{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
.details li code{font-family:var(--font-mono);font-size:12.5px}
.details .why{color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:12px 14px}

/* state */
.state-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 16px;font-family:var(--font-mono);font-size:12px;font-variant-numeric:tabular-nums}
.state-grid div{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px dotted var(--line-soft)}
.state-grid div.nz{color:var(--ink)}
.state-grid div.z{color:var(--muted)}
.mem-table{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:12px;font-variant-numeric:tabular-nums}
.mem-table th{font-family:var(--font-ui);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:4px 10px 4px 0}
.mem-table td{padding:3px 10px 3px 0;border-top:1px solid var(--line-soft)}
.mem-table td.chg{color:var(--s-ex-ink);font-weight:600}
.scroll-x{overflow-x:auto}
.tabs{display:flex;gap:4px}
.tabs button{border:1px solid transparent;background:none;border-radius:4px;padding:4px 10px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--ink);border-color:var(--line)}
.foot{max-width:1500px;margin-inline:auto;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-block:12px}
.foot p{margin:4px 0;max-width:110ch}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>


<header class="top">
  <h1>Pipeline FP RISC-V</h1>
  <p data-i18n="hdr.sub"></p>
  <div class="lang" role="group" data-i18n-aria="lang.aria">
    <button type="button" data-lang="es" aria-pressed="false">ES</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
</header>

<div class="layout">
  <div class="col">
    <section class="panel" aria-labelledby="h-code">
      <div class="panel-h"><h2 id="h-code" data-i18n="prog.h"></h2><span class="label" data-i18n="prog.isa"></span></div>
      <div class="example-row">
        <label class="label" for="example" data-i18n="ex.label"></label>
        <select id="example"></select>
        <button class="btn small" id="load-example" type="button" data-i18n="ex.load"></button>
      </div>
      <div class="note" id="example-note"></div>
      <div class="editor">
        <div class="gutter" id="gutter" aria-hidden="true"></div>
        <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" data-i18n-aria="code.aria"></textarea>
      </div>
      <div class="editor-bar">
        <button class="btn primary" id="run" type="button" data-i18n="run"></button>
        <button class="btn" id="set-ref" type="button" data-i18n="setref" data-i18n-title="setref.title"></button>
        <span class="hint" data-i18n="hint"></span>
      </div>
      <div class="msg-error" id="error" hidden></div>
    </section>

    <section class="panel" aria-labelledby="h-cfg">
      <div class="panel-h"><h2 id="h-cfg" data-i18n="cpu.h"></h2><button class="btn small" id="reset-cfg" type="button" data-i18n="reset"></button></div>
      <div class="panel-b cfg">
        <div class="cfg-row">
          <label for="cfg-model" data-i18n="model.label"></label>
          <select id="cfg-model">
            <option value="ch3" data-i18n="model.ch3"></option>
            <option value="appc" data-i18n="model.appc"></option>
          </select>
        </div>
        <p class="note" style="padding:0" id="model-note"></p>
        <div class="cfg-row">
          <label class="check"><input type="checkbox" id="cfg-fwd"> <span data-i18n-html="fwd"></span></label>

const key = r => (r.f?'f':'x') + r.n;
const UNIT_PREFIX = {add:'A', mul:'M', div:'D'};

function simulate(prog, cfg){

    pendingPre = null;

      }

      }

      case 'load': {
        const o = memAddr(ins, ins.size);
        if (ins.rd.f) wr(ins.rd, ins.size===8 ? dv.getFloat64(o, true) : dv.getFloat32(o, true));
        else wr(ins.rd, ins.size===8 ? dv.getBigInt64(o, true) : BigInt(dv.getInt32(o, true)));
        break;
      }
      case 'store': {
        const o = memAddr(ins, ins.size), v = rv(ins.data);
        row.st = {o, size: ins.size, f: ins.data.f, v};
        if (ins.data.f) { if (ins.size===8) dv.setFloat64(o, v, true); else dv.setFloat32(o, v, true); }
        else { if (ins.size===8) dv.setBigInt64(o, w64(v), true); else dv.setInt32(o, Number(BigInt.asIntN(32, v)), true); }
        break;
      }
      case 'branch': taken = BR[ins.cmp](rv(ins.a), rv(ins.b)); row.taken = taken; if (taken) nextPc = ins.target; break;
      case 'jump': wr(ins.rd, BigInt((pc + 1) * 4)); taken = true; nextPc = ins.target; break;
      case 'jalr': taken = true; nextPc = Math.floor(Number(rv(ins.a)) / 4); break;
      case 'fp': {
        const a = rv(ins.a), b = ins.b ? rv(ins.b) : 0;
        let v = {add:a+b, sub:a-b, mul:a*b, div:a/b, sqrt:Math.sqrt(a), min:Math.min(a,b), max:Math.max(a,b)}[ins.op];
        if (ins.single) v = Math.fround(v);
        wr(ins.rd, v); break;
      }
      case 'fpint': {
        if (ins.op === 'i2f') { let v = Number(ins.w32 ? BigInt.asIntN(32, rv(ins.a)) : rv(ins.a)); if (ins.single) v = Math.fround(v); wr(ins.rd, v); break; }
        const a = rv(ins.a), b = ins.b ? rv(ins.b) : 0;
        if (ins.op === 'f2i') { wr(ins.rd, fcvtInt(a, ins.w32 ? 32 : 64)); break; }
        if (ins.op === 'ceq' || ins.op === 'clt' || ins.op === 'cle') { wr(ins.rd, ({ceq:a===b, clt:a<b, cle:a<=b}[ins.op]) ? 1n : 0n); break; }
        let v = {mv:a, neg:-a, abs:Math.abs(a)}[ins.op]; if (ins.single) v = Math.fround(v);
        wr(ins.rd, v); break;
      }
    }
    if (ins.rd && !(ins.rd.n===0 && !ins.rd.f)) {
      const L = ins.kind === 'load' ? M : M - 1;
      avail[key(ins.rd)] = {L, W:M+1, text:ins.text, line:ins.line};
      lastW[key(ins.rd)] = {W:M+1, text:ins.text, line:ins.line};
    }
    rows.push(row); dyn++;
    lastX = Xc;

    if (ins.kind === 'halt') break;
    const isCtl = ins.kind==='branch' || ins.kind==='jump' || ins.kind==='jalr';
    if (isCtl && isSlot) throw new AsmError(ins.line, t('err.branchInSlot'));
    // first cycle in which the branch target is known
    const resolvedAt = resEX ? Xc + 1 : Xc;
    if (isSlot) {
      pc = slotReturn; slotReturn = null;
      nextF = Math.max(D, slotInfo.at);
      const lost = nextF - D;           // with branches in EX one slot is not enough: one more cycle is lost
      if (lost > 0) pendingPre = {from:D, to:nextF, lost, b:slotInfo.b};
      slotInfo = null; continue;
    }
    if (isCtl) {
      if (cfg.branch === 'delayed' && pc + 1 < n) {
        slotReturn = nextPc; slotInfo = {at: resolvedAt, b: ins.text}; pc = pc + 1; nextF = D;
        continue;
      }
      if (cfg.branch === 'freeze' || cfg.branch === 'delayed') {   // (delayed branch with no instruction for the slot: freeze)
        nextF = resolvedAt; pendingPre = {from:D, to:nextF, lost:LOST, b:ins.text}; pc = nextPc; continue;
      }
      // predict not taken: if taken, squash the instructions fetched behind it
      if (taken) {
        let f = D;
        for (let k = 1; k <= LOST; k++) {
          const wrong = pc + k, dd = k === 1 ? Xc : f + 1;
          rows.push({ins: wrong < n ? prog.instrs[wrong] : {text:t('nextAddr'), line:''}, F:f, D:dd, X:dd, M:0, W:dd, stalls:[], exStalls:[], flushed:true});
          f = dd;
        }
        nextF = resolvedAt; stats.control += LOST;
      } else nextF = D;
      pc = nextPc; continue;
    }
    nextF = D; pc = nextPc;
  }

  const real = rows.filter(r => !r.flushed);
  const cycles = real.length ? Math.max(...real.map(r => r.W)) : 0;
  return {rows, stats, cycles, count: real.length, cpi: real.length ? cycles / real.length : 0, xr, fr, dv, warning};
}

/* cells of one diagram row: Map cycle -> {t, k, why}
   With cfg.stallFirst, stalls are drawn before the stage the instruction is waiting for
   (the stage appears in the cycle it actually advances, as in the 7th edition);
   without it, stage first and then stalls, as in some earlier Hennessy-Patterson editions. */
function rowCells(r, cfg){
  const c = new Map();
  const first = cfg.stallFirst !== false;
  // stage `lab` occupied from a to b-1, with stalls `cause(cycle)` while it waits
  const span = (a, b, lab, cause) => {
    if (first) { for (let k = a; k < b - 1; k++) c.set(k, cause(k + 1)); c.set(b - 1, lab); }
    else { c.set(a, lab); for (let k = a + 1; k < b; k++) c.set(k, cause(k)); }
  };
  const wait = why => () => ({t:'stall', k:'wait', why});
  if (r.flushed) {
    span(r.F, r.D, {t:'IF', k:'IF'}, wait(t('cell.waitID')));
    c.set(r.D, {t:'✕', k:'flush', why:t('cell.flushed')});
    return c;
  }
  if (r.pre) {   // freeze: cycles with no fetch until the branch is resolved
    const lost = r.pre.lost || 1;
    for (let k = r.pre.from; k < r.pre.to - lost; k++) c.set(k, {t:'stall', k:'wait', why:t('cell.waitID')});
    for (let k = r.pre.to - lost; k < r.pre.to; k++) c.set(k, {t:'stall', k:'control', why:t('cell.ctrlFreeze', {b:r.pre.b})});
  }
  const causeIn = (list, where) => k => {
    const s = list.find(q => k >= q.from && k < q.to);
    return s ? {t:'stall', k:s.type, why:`${typeName(s.type)}${where}: ${s.why}`} : {t:'stall', k:'wait', why:t('cell.wait')};
  };
  span(r.F, r.D, {t:'IF', k:'IF'}, wait(t('cell.waitIF')));
  span(r.D, r.X, {t:'ID', k:'ID'}, causeIn(r.stalls, ''));
  const u = r.ins.unit;
  if (u === 'int') span(r.X, r.M, {t:'EX', k:'EX'}, causeIn(r.exStalls, t('cell.inEX')));
  else {
    const lat = r.M - r.X;
    for (let i = 0; i < lat; i++) c.set(r.X + i, {t: UNIT_PREFIX[u] + (i+1), k: UNIT_PREFIX[u]});
  }
  c.set(r.M, {t:'MEM', k:'MEM'});
  c.set(r.W, {t:'WB', k:'WB'});
  return c;
}
/* where an instruction physically is in cycle c (independent of how it is drawn) */
function locate(r, c){
  if (c < r.F) return null;
  const cover = (list) => list.find(s => c >= s.from && c < s.to);
  if (c < r.D) return {st:'IF', wait: c > r.F, type:'wait', why:t('why.idBusy')};
  if (r.flushed) return null;
  if (c < r.X) { const s = cover(r.stalls); return {st:'ID', wait: !!s, type: s && s.type, why: s && s.why}; }
  if (c < r.M) {
    if (r.ins.unit === 'int') { const s = cover(r.exStalls); return {st:'EX', wait: !!s, type: s && s.type, why: s && s.why}; }
    return {st: r.ins.unit, idx: c - r.X};
  }
  if (c === r.M) return {st:'MEM'};
  if (c === r.W) return {st:'WB'};
  return null;
}
/* registers and memory at the end of cycle c */
function stateAt(sim, prog, c){
  const x = new Array(32).fill(0n), f = new Float64Array(32), dv = new DataView(prog.memInit.slice(0));
  const changed = new Set();
  for (const r of sim.rows) {
    if (r.flushed) continue;
    if (r.wkey && r.W <= c) { const n = +r.wkey.slice(1); if (r.wkey[0]==='f') f[n] = r.wval; else x[n] = r.wval; if (r.W === c) changed.add(r.wkey); }
    if (r.st && r.M <= c) {
      const {o, size, f:isF, v} = r.st;
      if (isF) { if (size===8) dv.setFloat64(o, v, true); else dv.setFloat32(o, v, true); }
      else { if (size===8) dv.setBigInt64(o, BigInt.asIntN(64, v), true); else dv.setInt32(o, Number(BigInt.asIntN(32, v)), true); }
      if (r.M === c) changed.add('m' + (DATA_BASE + o));
    }
  }
  return {x, f, dv, changed};
}

        fdiv.d  f14, f4, f6
        fsd     f14, 16(x2)
`, en:
`# Independent divisions: pipelined divider or not
.data
v:      .double 8.0, 4.0, 2.0

.text
        la      x2, v
        fld     f2, 0(x2)
        fld     f4, 8(x2)
        fld     f6, 16(x2)
        fdiv.d  f10, f2, f4
        fdiv.d  f12, f2, f6
        fdiv.d  f14, f4, f6
        fsd     f14, 16(x2)
`}},
];

const DEFAULT_CFG = {model:'ch3', stallFirst:true, forwarding:true, branch:'pnt', resolve:'ex', lat:{add:4, mul:7, div:25}, pipelined:{add:true, mul:true, div:false}};
const PAGE = 40;

function initUI(){
  const $ = id => document.getElementById(id);
  const code = $('code'), gutter = $('gutter');
  let cfg = structuredClone(DEFAULT_CFG);
  let page = 0, last = null, lastErrLine = null, reference = null;
  let stepMode = false, cur = 1, playTimer = null;
  const store = {
    get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
    set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  };

  // examples
  const sel = $('example');
  let noteKey = null;      // id of the example whose note is shown, or 'restored'
  function fillExamples(){
    const v = sel.value;
    sel.innerHTML = EXAMPLES.map(e => `<option value="${e.id}">${e.name[LANG]}</option>`).join('');
    if (v) sel.value = v;
  }
  function showNote(){
    const e = EXAMPLES.find(x => x.id === noteKey);
    $('example-note').textContent = noteKey === 'restored' ? t('restored') : e ? e.note[LANG] : '';
  }
  function loadExample(id){
    const e = EXAMPLES.find(x => x.id === id) || EXAMPLES[0];
    sel.value = e.id;
    code.value = e.code[LANG];
    cfg.branch = e.branch || 'pnt';
    cfg.model = e.model || 'ch3';
    if (e.units) Object.assign(cfg.pipelined, e.units);   // the example needs this unit configured this way
    noteKey = e.id; showNote();
    syncCfgUI(); updateGutter(); run(true);
  }
  $('load-example').addEventListener('click', () => loadExample(sel.value));

  // configuration
  function syncCfgUI(){
    $('cfg-model').value = cfg.model;
    $('cfg-stallfirst').checked = cfg.stallFirst !== false;
    $('cfg-fwd').checked = cfg.forwarding;
    $('cfg-branch').value = cfg.branch;
    $('cfg-resolve').value = cfg.resolve;
    for (const u of ['add','mul','div']) { $('lat-'+u).value = cfg.lat[u]; $('pip-'+u).checked = cfg.pipelined[u]; }
  }
  function readCfgUI(){
    cfg.model = $('cfg-model').value;
    cfg.stallFirst = $('cfg-stallfirst').checked;
    cfg.forwarding = $('cfg-fwd').checked;
    cfg.branch = $('cfg-branch').value;
    cfg.resolve = $('cfg-resolve').value;
    for (const u of ['add','mul','div']) {
      const v = parseInt($('lat-'+u).value, 10);
      cfg.lat[u] = Number.isFinite(v) ? Math.min(60, Math.max(1, v)) : DEFAULT_CFG.lat[u];
      if ($('lat-'+u).value !== String(cfg.lat[u]) && document.activeElement !== $('lat-'+u)) $('lat-'+u).value = cfg.lat[u];
      cfg.pipelined[u] = $('pip-'+u).checked;
    }
  }
  ['cfg-model','cfg-stallfirst','cfg-fwd','cfg-branch','cfg-resolve','lat-add','lat-mul','lat-div','pip-add','pip-mul','pip-div'].forEach(id =>
    $(id).addEventListener('change', () => { readCfgUI(); for (const u of ['add','mul','div']) $('lat-'+u).value = cfg.lat[u]; run(false); }));
  $('reset-cfg').addEventListener('click', () => { const b = cfg.branch, md = cfg.model, sf = cfg.stallFirst, rs = cfg.resolve; cfg = structuredClone(DEFAULT_CFG); cfg.branch = b; cfg.model = md; cfg.stallFirst = sf; cfg.resolve = rs; syncCfgUI(); run(false); });

  // editor
  function updateGutter(){
    const nLines = code.value.split('\n').length;
    let h = '';
    for (let i = 1; i <= nLines; i++) h += `<div${i===lastErrLine?' class="err"':''}>${i}</div>`;
    gutter.innerHTML = h;
    gutter.scrollTop = code.scrollTop;
  }
  code.addEventListener('scroll', () => { gutter.scrollTop = code.scrollTop; });
  let tmr = null;
  code.addEventListener('input', () => { updateGutter(); clearTimeout(tmr); tmr = setTimeout(() => run(false), 500); });
  code.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(false); }
    if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); const s = code.selectionStart; code.setRangeText('        ', s, code.selectionEnd, 'end'); updateGutter(); }
  });
  $('run').addEventListener('click', () => run(false));
  $('set-ref').addEventListener('click', () => {
    if (!last) return;
    reference = {cycles:last.cycles, count:last.count, name: sel.options[sel.selectedIndex]?.text || t('ref.yours')};
    renderRef();
  });

  // tabs
  const tabs = ['stalls','regs','mem'];
  tabs.forEach(tb => $('tab-'+tb).addEventListener('click', () => tabs.forEach(o => {
    $('tab-'+o).setAttribute('aria-selected', String(o===tb)); $('det-'+o).hidden = o!==tb;
  })));

  // legend
  function renderLegend(){
    const leg = [['IF','IF'],['ID','ID'],['EX','EX'],['A','A1'],['M','M1'],['D','D1'],['MEM','MEM'],['WB','WB'],['raw','stall'],['struct','stall'],['waw','stall'],['wait','stall'],['control','stall'],['flush','✕']];
    $('legend').innerHTML = leg.map(([k,tx]) => `<span class="chip"><span class="tag k-${k}">${tx}</span>${t('leg.'+k)}</span>`).join('');
  }

  function run(resetPage){
    readCfgUI();
    store.set('pfp-code', code.value); store.set('pfp-cfg', cfg);
    const errBox = $('error');
    try {
      const prog = assemble(code.value);
      last = simulate(prog, cfg);
      last.prog = prog;
      lastErrLine = null; errBox.hidden = true;
      if (resetPage) { page = 0; cur = 1; }
      cur = Math.min(Math.max(1, cur), last.cycles || 1);
      const maxPage = Math.max(0, Math.ceil(last.rows.length / PAGE) - 1);
      if (page > maxPage) page = maxPage;
      render();
    } catch (e) {
      if (!(e instanceof AsmError)) { console.error(e); }
      lastErrLine = e.line || null;
      errBox.hidden = false;
      errBox.textContent = (e.line ? t('err.line',{l:e.line}) : '') + e.message;
    }
    updateGutter();
  }

  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmtNum = v => typeof v === 'bigint' ? String(v) : Number.isInteger(v) ? String(v) : String(Number(v.toPrecision(10)));

  function render(){
    const r = last;
    $('model-note').textContent = t(cfg.model === 'ch3' ? 'model.note.ch3' : 'model.note.appc');
    $('resolve-note').textContent = t(cfg.resolve === 'id' ? 'resolve.note.id' : 'resolve.note.ex');
    $('branch-note').hidden = cfg.branch !== 'delayed';
    $('branch-note').textContent = t('branch.note.delayed');
    const totalStalls = r.stats.raw + r.stats.struct + r.stats.waw + r.stats.control;
    $('cfg-summary').textContent = `${t(cfg.model==='ch3'?'sum.ch3':'sum.appc')} · ${t(cfg.forwarding?'sum.fwdOn':'sum.fwdOff')} · ${t('sum.'+cfg.branch)} · ${t(cfg.resolve==='id'?'sum.resID':'sum.resEX')}`;
    $('stats').innerHTML = [
      [t('stat.cycles'), r.cycles],
      [t('stat.instr'), r.count],
      [t('stat.cpi'), r.cpi.toFixed(2)],
      [t('stat.stalls'), totalStalls],
    ].map(([l,v]) => `<div class="stat"><div class="label">${l}</div><div class="v">${v}</div></div>`).join('');
    const bd = [['raw',t('bd.raw'),'k-raw'],['struct',t('bd.struct'),'k-struct'],['waw',t('bd.waw'),'k-waw'],['control',t('bd.control'),'k-flush']];
    $('breakdown').innerHTML = `<span class="label">${t('bd.title')}</span>` + bd.map(([k,l,c]) =>
      `<span class="chip"><span class="sw ${c}" style="${k==='control'?'background:var(--flush)':''}"></span>${l}: <strong>${r.stats[k]}</strong></span>`).join('');
    $('warn').innerHTML = r.warning ? `<div class="warn">${esc(r.warning)}</div>` : '';
    renderRef();
    if (stepMode) renderPipe();
    renderDiagram();
    renderDetails();
  }

  function renderRef(){
    const box = $('ref');
    if (!reference || !last) { box.hidden = true; return; }
    box.hidden = false;
    const sp = reference.cycles / last.cycles;
    const cls = sp >= 1 ? 'speed-up' : 'speed-down';
    box.innerHTML = `<span class="label">${t('ref.label')}</span><span>${esc(reference.name)}: <strong>${reference.cycles}</strong> ${t('w.cycles')}</span><span>${t('ref.now')}: <strong>${last.cycles}</strong> ${t('w.cycles')}</span><span class="${cls}">${t('ref.speedup')} ${sp.toFixed(2)}×</span><button class="btn small" type="button" id="clear-ref">${t('ref.clear')}</button>`;
    $('clear-ref').addEventListener('click', () => { reference = null; renderRef(); });
  }

  function renderDiagram(){
    const rows = last.rows;
    let from = page*PAGE, to = page*PAGE + PAGE;
    if (stepMode) {
      let lastIdx = -1;
      rows.forEach((r, i) => { if ((r.pre ? r.pre.to - (r.pre.lost || 1) : r.F) <= cur) lastIdx = i; });
      page = Math.max(0, Math.floor(lastIdx / PAGE));
      from = page*PAGE; to = Math.min(lastIdx + 1, page*PAGE + PAGE);
    }
    const slice = rows.slice(from, to);
    if (!slice.length) { $('diag').innerHTML = `<p class="empty">${t('diag.none')}</p>`; $('pager').innerHTML=''; return; }
    const cellMaps = slice.map(r => {
      const m = rowCells(r, cfg);
      if (stepMode) for (const k of [...m.keys()]) if (k > cur) m.delete(k);
      return m;
    });
    let c0 = Infinity, c1 = 0;
    for (const m of cellMaps) for (const k of m.keys()) { if (k < c0) c0 = k; if (k > c1) c1 = k; }
    if (stepMode) { c1 = Math.max(c1, cur); if (!Number.isFinite(c0)) c0 = cur; }
    let h = `<table class="diag"><thead><tr><th class="ins-h">${t('diag.instr')}</th>`;
    for (let c = c0; c <= c1; c++) h += `<th scope="col"${stepMode && c===cur ? ' class="now"' : ''}>${c}</th>`;
    h += '</tr></thead><tbody>';
    slice.forEach((r, i) => {
      const m = cellMaps[i];
      h += `<tr class="${r.flushed && (!stepMode || cur >= r.D) ? 'flushed' : ''}"><td class="ins" title="${esc(r.ins.text)}"><span class="ln">${r.ins.line}</span>${esc(r.ins.text)}${r.slot?`<span class="slot">${t('diag.slot')}</span>`:''}</td>`;
      for (let c = c0; c <= c1; c++) {
        const x = m.get(c), now = stepMode && c === cur ? ' now' : '';
        h += x ? `<td class="c${now}"><span class="k-${x.k}"${x.why?` title="${esc(x.why)}"`:''}>${x.t}</span></td>` : `<td class="c${now}"></td>`;
      }
      h += '</tr>';
    });
    h += '</tbody></table>';
    const wrap = $('diag');
    wrap.innerHTML = h;
    if (stepMode) {
      const th = wrap.querySelector('th.now');
      if (th) {
        const left = th.offsetLeft - wrap.clientWidth + 120;
        if (wrap.scrollLeft < left || wrap.scrollLeft > th.offsetLeft - 240) wrap.scrollLeft = Math.max(0, left);
      }
      wrap.scrollTop = wrap.scrollHeight;
    }
    const pages = Math.ceil(rows.length / PAGE);
    if (stepMode) $('pager').innerHTML = `<span>${t('pager.step',{c:cur, n:last.cycles})}</span>`;
    else if (pages > 1) {
      $('pager').innerHTML = `<button class="btn small" type="button" id="pg-prev" ${page===0?'disabled':''}>${t('pager.prev')}</button><span>${t('pager.range',{a:page*PAGE+1, b:Math.min(rows.length,(page+1)*PAGE), n:rows.length})}</span><button class="btn small" type="button" id="pg-next" ${page>=pages-1?'disabled':''}>${t('pager.next')}</button>`;
      $('pg-prev').addEventListener('click', () => { page--; renderDiagram(); });
      $('pg-next').addEventListener('click', () => { page++; renderDiagram(); });
    } else $('pager').innerHTML = `<span>${t('pager.rows',{n:rows.length})}</span>`;
  }

  /* ---------- cycle-by-cycle mode ---------- */
  function renderPipe(){
    const c = cur, rows = last.rows;
    $('st-now').textContent = t('pipe.now',{c, n:last.cycles});
    $('st-range').max = String(last.cycles); $('st-range').value = String(c);
    $('st-prev').disabled = c <= 1; $('st-first').disabled = c <= 1;
    $('st-next').disabled = c >= last.cycles; $('st-last').disabled = c >= last.cycles;
    // who is in each stage
    const occ = {};
    const put = (k, r, loc) => { (occ[k] = occ[k] || []).push({r, loc}); };
    for (const r of rows) {
      if (r.F > c) break;
      const loc = locate(r, c); if (!loc) continue;
      if (loc.st === 'add' || loc.st === 'mul' || loc.st === 'div') put(loc.st + loc.idx, r, loc);
      else put(loc.st, r, loc);
    }
    const short = s0 => { const m = s0.match(/^(\S+)\s+([^,]+)/); return m ? m[1] + ' ' + m[2] : s0; };
    const box = (k, name, cls, brief) => {
      const list = occ[k] || [];
      if (!list.length) return `<div class="stage idle"><span class="nm">${name}</span><span class="in">—</span></div>`;
      const waiting = list.find(o => o.loc.wait);
      const kcls = waiting ? 'k-' + (waiting.loc.type || 'wait') : cls;
      const title = list.map(o => o.r.ins.text + (o.loc.wait ? t('stage.stallTitle',{why:o.loc.why}) : '')).join('\n');
      return `<div class="stage ${kcls}" title="${esc(title)}"><span class="nm">${name}${waiting ? t('stage.stalled') : ''}</span>${list.map(o => `<span class="in">${esc(brief ? short(o.r.ins.text) : o.r.ins.text)}</span>`).join('')}</div>`;
    };
    const lane = (label, boxes) => `<div class="lane"><span class="lname">${label}</span>${boxes}</div>`;
    // FP unit: pipelined -> one box per stage (compact cells beyond 8 stages);
    // not pipelined -> a single box with a cycle counter.
    const unitLane = (u, P, kc) => {
      const n = Math.max(1, cfg.lat[u] | 0);
      const here = [];
      for (let i = 0; i < n; i++) for (const o of (occ[u + i] || [])) here.push({i, o});
      if (!cfg.pipelined[u]) {
        const h = here[0];
        if (!h) return `<div class="stage idle busy-np"><span class="nm">${P}1…${P}${n} · ${t('lane.notPip')}</span><span class="in">—</span></div>`;
        return `<div class="stage ${kc} busy-np" title="${esc(h.o.r.ins.text)}"><span class="nm">${P}${h.i + 1} / ${n} · ${t('lane.notPip')}</span><span class="in">${esc(short(h.o.r.ins.text))}</span></div>`;
      }
      if (n <= 8) { let b = ''; for (let i = 0; i < n; i++) b += box(u + i, P + (i+1), kc, true); return b; }
      let cells = '';
      for (let i = 0; i < n; i++) {
        const o = (occ[u + i] || [])[0];
        cells += o ? `<span class="mini on ${kc}" title="${P}${i+1}: ${esc(o.r.ins.text)}">${i+1}</span>`
                   : `<span class="mini" title="${P}${i+1}">${i+1}</span>`;
      }
      const cap = here.length ? here.map(h => `<b>${P}${h.i + 1}</b> ${esc(short(h.o.r.ins.text))}`).join(' · ') : t('lane.free');
      return `<div class="minis-wrap"><div class="minis">${cells}</div><div class="minis-cap">${cap}</div></div>`;
    };
    let lanes = lane(t('lane.int'), box('EX', 'EX', 'k-EX', true));
    lanes += lane(t('lane.add'), unitLane('add', 'A', 'k-A')) + lane(t('lane.mul'), unitLane('mul', 'M', 'k-M')) + lane(t('lane.div'), unitLane('div', 'D', 'k-D'));
    $('pipe').innerHTML = box('IF','IF','k-IF',true) + box('ID','ID','k-ID',true) + `<div class="lanes">${lanes}</div>` + box('MEM','MEM','k-MEM',true) + box('WB','WB','k-WB',true);

    // what happens in this cycle
    const ev = [];
    const fmtv = v => typeof v === 'bigint' ? String(v) : Number.isInteger(v) ? String(v) : String(Number(Number(v).toPrecision(10)));
    for (const r of rows) {
      if (r.pre && r.pre.to - (r.pre.lost || 1) === c) ev.push(['stall', 'k-control', t('ev.freeze',{b:`<code>${esc(r.pre.b)}</code>`})]);
      if (r.F > c) break;
      if (r.F === c) ev.push(['IF', 'k-IF', t('ev.fetch',{i:`<code>${esc(r.ins.text)}</code>`})]);
      if (r.flushed) { if (r.D === c) ev.push(['✕', 'k-flush', t('ev.flush',{i:`<code>${esc(r.ins.text)}</code>`})]); continue; }
      const loc = locate(r, c);
      if (loc && loc.wait && loc.st !== 'IF') ev.push(['stall', 'k-' + loc.type, t('ev.wait',{i:`<code>${esc(r.ins.text)}</code>`, st:loc.st, why:esc(loc.why)})]);
      const resC = cfg.resolve === 'id' ? r.X - 1 : r.X, resS = cfg.resolve === 'id' ? 'ID' : 'EX';
      if ((r.ins.kind === 'branch') && resC === c) ev.push([resS, 'k-' + resS, t('ev.resolved',{i:`<code>${esc(r.ins.text)}</code>`, res:t(r.taken ? 'ev.taken' : 'ev.notTaken')})]);
      if ((r.ins.kind === 'jump' || r.ins.kind === 'jalr') && resC === c) ev.push([resS, 'k-' + resS, t('ev.resolved',{i:`<code>${esc(r.ins.text)}</code>`, res:t('ev.taken')})]);
      if (r.st && r.M === c) ev.push(['MEM', 'k-MEM', t('ev.writes',{i:`<code>${esc(r.ins.text)}</code>`, dst:`M[0x${(DATA_BASE + r.st.o).toString(16)}]`, v:fmtv(r.st.v)})]);
      if (r.wkey && r.W === c) ev.push(['WB', 'k-WB', t('ev.writes',{i:`<code>${esc(r.ins.text)}</code>`, dst:r.wkey, v:(r.wkey[0]==='x' && r.wval >= DATA_BASE && r.wval < DATA_BASE+MEM_SIZE ? '0x'+r.wval.toString(16) : fmtv(r.wval))})]);
    }
    $('events').innerHTML = `<p class="label" style="margin:4px 0 2px">${t('ev.title',{c})}</p>` +
      (ev.length ? ev.map(([tg, k, txt]) => `<div><span class="tag ${k}">${tg}</span><span>${txt}</span></div>`).join('') : `<span class="empty" style="padding:0">${t('ev.none')}</span>`);
  }

  function renderDetails(){
    const items = [];
    last.rows.forEach(r => {
      if (r.flushed) return;
      const all = [...r.stalls.map(s => ({...s, where:'ID'})), ...r.exStalls.map(s => ({...s, where:'EX'}))];
      if (!all.length) return;
      const g = new Map();
      for (const s of all) { const k = s.type + '|' + s.why + '|' + s.where; g.set(k, (g.get(k)||{...s, n:0})); g.get(k).n += s.to - s.from; }
      const reasons = [...g.values()].map(s => `<span class="why">${t('det.reason',{n:`${s.n} ${t(s.n>1?'w.cycles':'w.cycle')}`, type:typeName(s.type), where:s.where, why:esc(s.why)})}</span>`).join('');
      items.push(`<li><span><code>${esc(r.ins.text)}</code> <span class="why">${t('det.at',{l:r.ins.line, c:r.D})}</span></span>${reasons}</li>`);
    });
    $('det-stalls').innerHTML = items.length ? `<ol>${items.join('')}</ol>` : `<p class="empty">${t('det.none')}</p>`;

    const st = stepMode ? stateAt(last, last.prog, cur) : {x:last.xr, f:last.fr, dv:last.dv, changed:new Set()};
    const xr = st.x, fr = st.f;
    const when = stepMode ? t('regs.whenStep',{c:cur}) : t('regs.whenEnd');
    let regs = `<p class="label" style="margin:0 0 6px">${t('regs.fp')}${when}</p><div class="state-grid">`;
    for (let i = 0; i < 32; i++) regs += `<div class="${st.changed.has('f'+i)?'chg':fr[i]!==0?'nz':'z'}"><span>f${i}</span><span>${fmtNum(fr[i])}</span></div>`;
    regs += `</div><p class="label" style="margin:14px 0 6px">${t('regs.int')}${when}</p><div class="state-grid">`;
    let anyInt = false;
    for (let i = 1; i < 32; i++) if (xr[i] !== 0n) { anyInt = true; regs += `<div class="${st.changed.has('x'+i)?'chg':'nz'}"><span>x${i}</span><span>${xr[i] >= DATA_BASE && xr[i] < DATA_BASE+MEM_SIZE ? '0x'+xr[i].toString(16) : xr[i]}</span></div>`; }
    regs += anyInt ? '</div>' : `</div><p class="empty" style="padding:0">${t('regs.allZero')}</p>`;
    $('det-regs').innerHTML = regs;

    const di = last.prog.dataItems;
    if (!di.length) { $('det-mem').innerHTML = `<p class="empty" style="padding:0">${t('mem.none')}</p>`; return; }
    const init = new DataView(last.prog.memInit), fin = st.dv;
    const rd = (v, it) => { const o = it.addr - DATA_BASE; return it.type==='double' ? v.getFloat64(o,true) : it.type==='float' ? v.getFloat32(o,true) : it.type==='dword' ? v.getBigInt64(o,true) : v.getInt32(o,true); };
    let mt = `<table class="mem-table"><thead><tr><th>${t('mem.addr')}</th><th>${t('mem.label')}</th><th>${t('mem.type')}</th><th>${t('mem.init')}</th><th>${stepMode ? t('mem.cycle',{c:cur}) : t('mem.final')}</th></tr></thead><tbody>`;
    for (const it of di) {
      const a = rd(init, it), b = rd(fin, it);
      mt += `<tr class="${st.changed.has('m'+it.addr)?'chg':''}"><td>0x${it.addr.toString(16)}</td><td>${esc(it.label)}</td><td>.${it.type}</td><td>${fmtNum(a)}</td><td class="${Object.is(a,b)?'':'chg'}">${fmtNum(b)}</td></tr>`;
    }
    $('det-mem').innerHTML = mt + '</tbody></table>';
  }

  // cycle-by-cycle controls
  function setMode(step){
    stepMode = step; stopPlay();
    $('mode-full').setAttribute('aria-pressed', String(!step));
    $('mode-step').setAttribute('aria-pressed', String(step));
    $('pipe-panel').hidden = !step;
    if (step) cur = 1;
    if (last) render();
  }
  function goto(c){
    if (!last) return;
    cur = Math.min(last.cycles, Math.max(1, c));
    renderPipe(); renderDiagram(); renderDetails();
  }
  function stopPlay(){ if (playTimer) { clearInterval(playTimer); playTimer = null; } $('st-play').textContent = t('st.play'); }
  function togglePlay(){
    if (playTimer) { stopPlay(); return; }
    if (cur >= last.cycles) goto(1);
    $('st-play').textContent = t('st.pause');
    playTimer = setInterval(() => { if (cur >= last.cycles) { stopPlay(); return; } goto(cur + 1); }, +$('st-speed').value);
  }
  $('mode-full').addEventListener('click', () => setMode(false));
  $('mode-step').addEventListener('click', () => setMode(true));
  $('st-first').addEventListener('click', () => { stopPlay(); goto(1); });
  $('st-prev').addEventListener('click', () => { stopPlay(); goto(cur - 1); });
  $('st-next').addEventListener('click', () => { stopPlay(); goto(cur + 1); });
  $('st-last').addEventListener('click', () => { stopPlay(); goto(last.cycles); });
  $('st-play').addEventListener('click', togglePlay);
  $('st-range').addEventListener('input', e => { stopPlay(); goto(+e.target.value); });
  $('st-speed').addEventListener('change', () => { if (playTimer) { stopPlay(); togglePlay(); } });
  document.addEventListener('keydown', e => {
    if (!stepMode || !last) return;
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (['TEXTAREA','INPUT','SELECT'].includes(tag) && document.activeElement.type !== 'range') return;
    if (e.key === 'ArrowRight') { e.preventDefault(); stopPlay(); goto(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); stopPlay(); goto(cur - 1); }
  });

  // language
  function applyStatic(){
    document.documentElement.lang = LANG;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
    document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
    document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
    document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));
    $('st-play').textContent = t(playTimer ? 'st.pause' : 'st.play');
    fillExamples(); renderLegend(); showNote();
  }
  function setLang(l){
    if (!I18N[l] || l === LANG) return;
    const old = LANG;
    // if the editor holds an unmodified example, swap it for its version in the other language
    const ex = EXAMPLES.find(e => e.code[old] === code.value);
    LANG = l; store.set('pfp-lang', l);
    if (ex) code.value = ex.code[l];
    if (reference && ex && reference.name === ex.name[old]) reference.name = ex.name[l];
    applyStatic(); updateGutter(); run(false);
  }
  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

  // start-up
  const savedLang = store.get('pfp-lang');
  LANG = I18N[savedLang] ? savedLang : ((navigator.language || 'es').toLowerCase().startsWith('es') ? 'es' : 'en');
  applyStatic();
  const savedCode = store.get('pfp-code'), savedCfg = store.get('pfp-cfg');
  if (savedCfg && savedCfg.lat) cfg = {...structuredClone(DEFAULT_CFG), ...savedCfg, lat:{...DEFAULT_CFG.lat, ...savedCfg.lat}, pipelined:{...DEFAULT_CFG.pipelined, ...savedCfg.pipelined}};
  if (typeof savedCode === 'string' && savedCode.trim()) {
    code.value = savedCode;
    const ex = EXAMPLES.find(e => e.code.es === savedCode || e.code.en === savedCode);
    if (ex) { code.value = ex.code[LANG]; sel.value = ex.id; noteKey = ex.id; }
    else { sel.value = 'loop'; noteKey = 'restored'; }
    showNote(); syncCfgUI(); updateGutter(); run(true);
  } else {
    loadExample('loop');
  }
}
if (typeof document !== 'undefined') initUI();
</script>
